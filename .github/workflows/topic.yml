name: Topic update / build

# Manual operator path for one Wikipedia topic:
#   update — restore corpus from Cloudflare R2 (if configured), refresh analysis
#            (cover_missing_topics --mode full), sync corpus back to R2, rebuild site
#   build  — rebuild site artifacts from committed findings only (no R2, no reanalyze)
#
# Secrets come from the GitHub Environment `topic-ops` (not hard-coded). Pages deployment
# stays out of band — this workflow commits findings + docs when `commit` is true; publish
# via the usual Pages source (docs/ on the default branch) after merge.

on:
  workflow_dispatch:
    inputs:
      topic:
        description: Wikipedia article title (e.g. Zionism)
        required: true
        type: string
      mode:
        description: update = reanalyze + site; build = site artifacts only
        required: true
        type: choice
        options:
          - update
          - build
        default: build
      provider:
        description: LLM provider (xai / anthropic / openai / google / grok)
        required: false
        type: string
        default: xai
      model:
        description: LLM model id (empty = provider default from repo config)
        required: false
        type: string
        default: grok-4.3
      framing:
        description: On update, pass --framing (L5 Framing Lite; needs an LLM key)
        required: false
        type: boolean
        default: true
      commit:
        description: Commit findings + docs back to the triggering branch
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: topic-${{ github.event.inputs.topic }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  topic:
    name: "${{ github.event.inputs.mode }} · ${{ github.event.inputs.topic }}"
    runs-on: ubuntu-latest
    environment: topic-ops
    # Full analyze + pipeline for a hot article can run for hours (WikiWho + LLM).
    timeout-minutes: 360
    env:
      # Provider/model from inputs — never echo secret values.
      WIKIDRIFT_LLM_PROVIDER: ${{ github.event.inputs.provider }}
      WIKIDRIFT_LLM_MODEL: ${{ github.event.inputs.model }}
      # Keys from Environment `topic-ops` (set only the providers you use).
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      WIKIDRIFT_LLM_API_KEY: ${{ secrets.WIKIDRIFT_LLM_API_KEY }}
      # Cloudflare R2 (S3-compatible) — corpus persistence for update mode.
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PREFIX: ${{ secrets.R2_PREFIX }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
      TOPIC: ${{ github.event.inputs.topic }}
      MODE: ${{ github.event.inputs.mode }}
      DATA_DIR: .planning/spikes/data
    steps:
      - uses: actions/checkout@v4
        with:
          # Persist credentials so the optional commit step can push with GITHUB_TOKEN.
          persist-credentials: true
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync (LLM extras for xAI / OpenAI-compatible + Gemini)
        run: uv sync --extra all-llm

      - name: Restore corpus from R2
        if: env.MODE == 'update'
        run: |
          set -euo pipefail
          if [ -z "${R2_ACCOUNT_ID:-}" ] || [ -z "${R2_ACCESS_KEY_ID:-}" ] \
             || [ -z "${R2_SECRET_ACCESS_KEY:-}" ] || [ -z "${R2_BUCKET:-}" ]; then
            echo "::notice::R2 secrets not fully set on Environment topic-ops; skipping corpus restore (cold start OK)"
            exit 0
          fi
          PREFIX="${R2_PREFIX:-corpus/}"
          case "$PREFIX" in
            */) ;;
            *) PREFIX="${PREFIX}/" ;;
          esac
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          mkdir -p "$DATA_DIR"
          echo "Restoring corpus from s3://${R2_BUCKET}/${PREFIX} (findings excluded — git is source of truth)"
          # Empty bucket / missing keys: aws exits 0 with nothing copied; treat other failures as soft.
          aws s3 sync "s3://${R2_BUCKET}/${PREFIX}" "$DATA_DIR/" \
            --endpoint-url "$ENDPOINT" \
            --only-show-errors \
            --exclude "findings/*" \
            --exclude "*/findings/*" \
            --exclude "*/logs/*" \
            --exclude "mscore/*" \
            --exclude "*/mscore/*" \
            || echo "::warning::R2 restore soft-failed (empty bucket or network); continuing without cached corpus"
          if [ -f "$DATA_DIR/provenance.duckdb" ]; then
            echo "Restored shared provenance.duckdb"
          else
            echo "No shared provenance.duckdb in R2 yet (first seed will upload after update)"
          fi
          ls -la "$DATA_DIR" 2>/dev/null | head -20 || true

      - name: Update topic (analyze + pipeline layers)
        if: env.MODE == 'update'
        run: |
          set -euo pipefail
          FRAMING_FLAG=()
          if [ "${{ github.event.inputs.framing }}" = "true" ]; then
            FRAMING_FLAG=(--framing)
          fi
          # Same operator path as README: full coverage for one explicit topic.
          # No --force: restored DuckDB snapshots are skipped (incremental fetch).
          # Corpus DuckDB is gitignored; only findings JSON is committed to git.
          uv run python tools/cover_missing_topics.py \
            --topics "$TOPIC" \
            --mode full \
            --execute \
            --no-resume \
            "${FRAMING_FLAG[@]}"

      - name: Export L3 diff/blame (needs local corpus from update)
        if: env.MODE == 'update'
        run: |
          set -euo pipefail
          # Best-effort: site still builds from findings if WikiWho/API export fails.
          uv run python viewer/export_l3.py || {
            echo "::warning::export_l3.py failed; continuing with committed L3 / findings only"
          }

      - name: Upload corpus to R2
        if: env.MODE == 'update'
        run: |
          set -euo pipefail
          if [ -z "${R2_ACCOUNT_ID:-}" ] || [ -z "${R2_ACCESS_KEY_ID:-}" ] \
             || [ -z "${R2_SECRET_ACCESS_KEY:-}" ] || [ -z "${R2_BUCKET:-}" ]; then
            echo "::notice::R2 secrets not fully set; skipping corpus upload"
            exit 0
          fi
          PREFIX="${R2_PREFIX:-corpus/}"
          case "$PREFIX" in
            */) ;;
            *) PREFIX="${PREFIX}/" ;;
          esac
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          if [ ! -d "$DATA_DIR" ]; then
            echo "::notice::No $DATA_DIR to upload"
            exit 0
          fi
          echo "Syncing corpus to s3://${R2_BUCKET}/${PREFIX} (findings/logs/mscore excluded)"
          # First successful update seeds an empty bucket; later runs are incremental syncs.
          aws s3 sync "$DATA_DIR/" "s3://${R2_BUCKET}/${PREFIX}" \
            --endpoint-url "$ENDPOINT" \
            --only-show-errors \
            --exclude "findings/*" \
            --exclude "*/findings/*" \
            --exclude "*/logs/*" \
            --exclude "mscore/*" \
            --exclude "*/mscore/*" \
            || echo "::warning::R2 upload soft-failed; findings/docs commit can still proceed"

      - name: Build static site (findings → docs/)
        run: |
          set -euo pipefail
          BUILD_ARGS=()
          # Categorize topics missing from the curated CATEGORY map when any LLM key is present.
          if [ -n "${XAI_API_KEY:-}" ] || [ -n "${ANTHROPIC_API_KEY:-}" ] \
             || [ -n "${OPENAI_API_KEY:-}" ] || [ -n "${GOOGLE_API_KEY:-}" ] \
             || [ -n "${WIKIDRIFT_LLM_API_KEY:-}" ]; then
            BUILD_ARGS+=(--llm-categories)
            if [ -n "${WIKIDRIFT_LLM_PROVIDER:-}" ]; then
              BUILD_ARGS+=(--provider "$WIKIDRIFT_LLM_PROVIDER")
            fi
            if [ -n "${WIKIDRIFT_LLM_MODEL:-}" ]; then
              BUILD_ARGS+=(--model "$WIKIDRIFT_LLM_MODEL")
            fi
          else
            echo "No LLM key in Environment topic-ops; using curated CATEGORY + topic_categories.json cache only"
          fi
          uv run python viewer/build.py "${BUILD_ARGS[@]}"
          uv run python viewer/check_contrast.py

      - name: Verify topic is on the site
        run: |
          set -euo pipefail
          SLUG=$(uv run python -c "from wikidrift import config; print(config.slugify('''$TOPIC'''))")
          PAGE="docs/article/${SLUG}.html"
          FINDINGS="docs/findings.html"
          if [ ! -f "$PAGE" ]; then
            echo "::error::Missing $PAGE — topic did not land as a first-class article page"
            echo "Findings must include confirmation/profile/sources/etc. so viewer/build.py discovers the article."
            exit 1
          fi
          if ! grep -q "$SLUG" "$FINDINGS"; then
            echo "::error::$SLUG not linked from findings index ($FINDINGS)"
            exit 1
          fi
          echo "OK: $PAGE present and linked from findings index"
          # Category: curated map in viewer/build.py CATEGORY wins; else topic_categories.json; else Other.
          CACHE=".planning/spikes/data/findings/topic_categories.json"
          if [ -f "$CACHE" ] && grep -F -q "\"$TOPIC\"" "$CACHE"; then
            echo "topic_categories.json has an entry for $TOPIC"
          else
            echo "::notice::If $TOPIC is not in viewer/build.py CATEGORY, it filters as Other until --llm-categories caches it or you edit the curated map."
          fi

      - name: Commit findings + docs
        if: github.event.inputs.commit == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # DuckDB / logs stay gitignored; only tracked findings + site land in the commit.
          git add \
            .planning/spikes/data/findings \
            .planning/spikes/data/articles \
            docs \
            viewer/data \
            || true
          if git diff --cached --quiet; then
            echo "No site/findings changes to commit"
            exit 0
          fi
          SLUG=$(uv run python -c "from wikidrift import config; print(config.slugify('''$TOPIC'''))")
          git commit -m "topic(${MODE}): ${TOPIC} (${SLUG})"
          git push origin "HEAD:${GITHUB_REF_NAME}"
