name: CI

# Runs on every push and PR. No secrets, no token corpus, no LLM keys are needed:
# the DB-dependent test auto-skips when the (gitignored) corpus is absent, and the site
# builds from the committed findings JSON. Pages *deployment* is intentionally NOT wired
# here — it stays a manual/design-gated step.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Sync (default install — no LLM extras, mirrors a fresh clone)
        run: uv sync
      - name: Run tests with coverage (fail_under floor is set in pyproject.toml)
        run: |
          uv run --with coverage python -m coverage run -m unittest discover -s tests -v
          uv run --with coverage python -m coverage report

  site:
    name: build viewer + WCAG AA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync
        run: uv sync
      - name: Build the static site (from committed findings — no corpus/keys)
        run: uv run python viewer/build.py
      - name: WCAG 2.1 AA contrast check
        run: uv run python viewer/check_contrast.py
